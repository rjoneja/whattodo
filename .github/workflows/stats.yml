name: stats
# Deploys the stats Worker (stats/worker.js) and its D1 database to Raj's Cloudflare account.
# Needs repo secrets: CF_API_TOKEN (Workers Scripts edit + D1 edit), CF_ACCOUNT_ID, DASH_KEY (dashboard password).
on:
  push:
    branches: [main]
    paths: ["stats/**", ".github/workflows/stats.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      DASH_KEY: ${{ secrets.DASH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Check secrets
        id: check
        run: |
          missing=""; for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DASH_KEY; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::notice::Stats not deployed yet: add repo secrets CF_API_TOKEN, CF_ACCOUNT_ID, DASH_KEY, then run this workflow."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        run: npm i --no-save wrangler@3
      - name: Database (create once) and wrangler config
        if: steps.check.outputs.skip != 'true'
        run: |
          cd stats
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const x=l.find(d=>d.name==="jauntout_stats");process.stdout.write(x?x.uuid:"")})')
          if [ -z "$id" ]; then npx wrangler d1 create jauntout_stats >/dev/null; id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="jauntout_stats");process.stdout.write(x.uuid)})'); fi
          printf 'name = "jauntout-stats"\nmain = "worker.js"\ncompatibility_date = "2024-11-01"\nworkers_dev = true\n\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "jauntout_stats"\ndatabase_id = "%s"\n' "$id" > wrangler.toml
          npx wrangler d1 execute jauntout_stats --remote --file schema.sql -y
      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          cd stats
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "$DASH_KEY" | npx wrangler secret put DASH_KEY
          [ -n "$url" ] || { echo "::error::No workers.dev address in the deploy output. In Cloudflare open Workers & Pages once and pick a workers.dev subdomain, then re-run."; exit 1; }
          echo "{\"url\":\"$url\"}" > ../docs/stats.json; echo "stats at $url"
      - name: Publish the address for the app
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add docs/stats.json && git commit -m "stats address" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((i*10)); done
