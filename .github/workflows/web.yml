name: web
on:
  workflow_dispatch:
    inputs:
      recheck: {description: "Re-vet all event pictures (yes/no)", default: "no"}
      skip_ingest: {description: "Pictures only (yes/no)", default: "no"}
      img_vets: {description: "Max picture checks this run", default: "1500"}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install anthropic pillow
      - run: python3 probe.py --new || true
        if: ${{ github.event.inputs.skip_ingest != 'yes' }}
      - run: python3 ingest.py --days 21 --out docs/events.json
        if: ${{ github.event.inputs.skip_ingest != 'yes' }}
        continue-on-error: true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - run: python3 tidy.py
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - run: python3 official_links.py || true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - run: python3 images.py --events docs/events.json --out docs/images.json ${{ github.event.inputs.recheck == 'yes' && '--recheck' || '' }} || true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", IMG_MAX_VETS: "${{ github.event.inputs.img_vets || '1500' }}"}
      - run: python3 share_pages.py
      - run: python3 sources_page.py || true
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add docs/events.json docs/images.json docs/e docs/sources venues.json
          git commit -m "web $(date +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; echo "push failed, retry $i"; sleep $((i*15)); done
          git diff --quiet origin/main HEAD || { echo 'push never succeeded'; exit 1; }
