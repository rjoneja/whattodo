name: submissions
# Hourly: write up new event submissions (Raj gets an approval email) and publish approved ones.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: submissions, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DASH_KEY: ${{ secrets.DASH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q anthropic pillow
      - id: sub
        run: python3 submissions.py | tee -a "$GITHUB_OUTPUT"
      - if: steps.sub.outputs.changed == '1'
        run: |
          python3 official_links.py || true
          python3 images.py --events docs/events.json --out docs/images.json || true
          python3 share_pages.py
          python3 sources_page.py || true
      - if: steps.sub.outputs.changed == '1'
        run: |
          .github/push.sh "submitted events $(date +%F)" docs/events.json docs/images.json docs/e docs/sources
