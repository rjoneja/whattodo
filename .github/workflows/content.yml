name: content
on:
  schedule: [{cron: "20 5 * * *"}, {cron: "20 7 * * *"}]   # second one is a back-up for late GitHub schedules
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 20}
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git log --since="$(date -u +%Y-%m-%d)T00:00:00Z" --format=%s | grep -q '^content '; then echo "skip=true" >> $GITHUB_OUTPUT; echo "already ran today"; fi
      - if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: pip install anthropic pillow
      - name: Probe newly added sources
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 probe.py --new || true
      - name: Web sources
        if: ${{ steps.check.outputs.skip != 'true' && env.ANTHROPIC_API_KEY != '' }}
        run: python3 ingest.py --days 21 --out docs/events.json
        continue-on-error: true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - name: Instagram
        if: ${{ steps.check.outputs.skip != 'true' && env.IG_TOKEN != '' }}
        run: python3 instagram.py --days 7 --out docs/events.json
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          IG_TOKEN: "${{ secrets.IG_TOKEN }}"
          IG_USER_ID: "${{ secrets.IG_USER_ID }}"
          IG_HOST: graph.facebook.com
          IG_API_VERSION: v26.0
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 tidy.py
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 official_links.py || true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - name: Pictures
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 images.py --events docs/events.json --out docs/images.json || true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 share_pages.py
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 sources_page.py || true
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          .github/push.sh "content $(date +%F)" docs/events.json docs/images.json docs/e docs/sources venues.json accounts.json ig_seen.json
