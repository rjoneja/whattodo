name: content
on:
  schedule: [{cron: "20 5 * * *"}, {cron: "20 7 * * *"}]   # second one is a back-up for late GitHub schedules
  workflow_dispatch:
    inputs:
      via: {description: "cron when started by the Cloudflare timer (then the once-a-day / every-other-day rules apply)", default: "hand"}
concurrency: {group: content, cancel-in-progress: false}   # a second start waits, then sees today's run and skips
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DASH_KEY: ${{ secrets.DASH_KEY }}   # lets meter.py report Claude spend to the dashboard
      EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}   # Eventbrite's official API (their pages block automated reading)
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 20}
      - id: check
        run: |
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.via }}" = "cron" ]; } && git log --since="$(date -u +%Y-%m-%d)T00:00:00Z" --format=%s | grep -q '^content '; then echo "skip=true" >> $GITHUB_OUTPUT; echo "already ran today"; fi
          # venue websites every other day (they post weeks ahead); Instagram and the rest stay daily
          if { [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event.inputs.via }}" != "cron" ]; } || [ $(( 10#$(date -u +%j) % 2 )) -eq 0 ]; then echo "web=true" >> $GITHUB_OUTPUT; else echo "venue websites: not today"; fi
      - if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: pip install anthropic pillow
      - name: Probe newly added sources
        if: ${{ steps.check.outputs.skip != 'true' && steps.check.outputs.web == 'true' }}
        run: python3 probe.py --new || true
      - name: Web sources
        if: ${{ steps.check.outputs.skip != 'true' && steps.check.outputs.web == 'true' }}
        run: python3 ingest.py --days 21 --out docs/events.json
        continue-on-error: true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - name: Instagram
        if: ${{ steps.check.outputs.skip != 'true' && env.IG_TOKEN != '' }}
        run: python3 instagram.py --days 7 --out docs/events.json
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          IG_TOKEN: "${{ secrets.IG_TOKEN }}"
          IG_USER_ID: "${{ secrets.IG_USER_ID }}"
          IG_HOST: graph.facebook.com
          IG_API_VERSION: v26.0
      - name: Each event's own page
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 deep_links.py || true
      - name: Eventbrite details
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 eventbrite_fill.py || true
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 tidy.py
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 official_links.py || true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
      - name: Pictures
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 images.py --events docs/events.json --out docs/images.json || true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", IMG_MAX_VETS: "200"}
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 share_pages.py
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: python3 sources_page.py || true; python3 about_page.py || true
      - if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          .github/push.sh "content $(date +%F)" docs/events.json docs/images.json docs/e docs/sources docs/about docs/followed.json venues.json accounts.json ig_seen.json ingest_cache.json
