<script>
// An old shared link (/e/<id>/) whose page has gone: hand it to the app, which finds the event (or the nearest match).
var m = location.pathname.match(/^\/e\/([^\/]+)\/?$/), q = new URLSearchParams(location.search);
if (m) location.replace('/?e=' + encodeURIComponent(m[1]) + '&s=' + (q.get('s') || 'link'));
</script></head>
